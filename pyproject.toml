[project]
name = "jarvis"
version = "0.2.0"
description = "Lets Grok see and control your Mac, like Jarvis from Iron Man."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "mcp>=2.3,<3",
    "uvicorn>=0.30",
    "pillow>=10",
    "numpy>=1.26",
    "sounddevice>=0.5; sys_platform == 'darwin'",
    "faster-whisper>=1.1; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=11; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=11; sys_platform == 'darwin'",
    "pyobjc-framework-Vision>=11; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=11; sys_platform == 'darwin'",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
